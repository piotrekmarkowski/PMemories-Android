name: Auto-fix (Claude Code)

# 15.09.2026 — odpowiednik `PMemories-iOS`'s `auto-fix.yml`. Odpalane
# RĘCZNIE (przyciskiem "🔧 Napraw" pod wiadomością błędu na Telegramie),
# NIGDY automatycznie po fail CI — ten sam duch, ta sama zasada usera:
# appka wykrywa i proponuje, naprawę zatwierdza człowiek przez PR.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID nieudanego runu CI do przeanalizowania'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch failure log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "${{ github.event.inputs.run_id }}" --log-failed > failure.log 2>&1 || echo "(nie udało się pobrać logu)" > failure.log

      - name: Create fix branch
        run: |
          git config user.name "Claude (auto-fix)"
          git config user.email "noreply@anthropic.com"
          git checkout -b "auto-fix/run-${{ github.event.inputs.run_id }}"

      - name: Run Claude Code to analyze and fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Przeanalizuj plik `failure.log` w katalogu repo — to log nieudanego
            runu CI (GitHub Actions run #${{ github.event.inputs.run_id }}) dla
            appki Android PMemories (Kotlin/Jetpack Compose, Gradle).

            Znajdź RZECZYWISTĄ przyczynę błędu w kodzie źródłowym i napraw ją
            minimalnie i precyzyjnie — nie rób refaktoryzacji niezwiązanych
            fragmentów, nie zmieniaj stylu kodu w miejscach, których błąd nie
            dotyczy.

            Jeśli NIE jesteś w stanie znaleźć/naprawić przyczyny z samego
            logu, jasno to napisz zamiast zgadywać losową zmianę.
          claude_args: "--max-turns 15 --allowedTools Read,Edit,Write,Bash,Grep,Glob"

      - name: Commit fix (if any)
        id: commit
        run: |
          rm -f failure.log
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "🤖 Auto-fix: CI run #${{ github.event.inputs.run_id }}"
            git push -u origin "auto-fix/run-${{ github.event.inputs.run_id }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh pr create \
            --title "🤖 Auto-fix: CI run #${{ github.event.inputs.run_id }}" \
            --body "Automatyczna próba naprawy błędu z CI run #${{ github.event.inputs.run_id }}, wygenerowana przez Claude Code. **Przejrzyj przed scaleniem — nic nie jest tu mergowane automatycznie.**" \
            --base main --head "auto-fix/run-${{ github.event.inputs.run_id }}")
          echo "pr_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        env:
          CI_LANG: ${{ vars.CI_LANG || 'pl' }}
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            if [ "$CI_LANG" = "en" ]; then
              MESSAGE=$(printf '🔧 Android auto-fix ready for review\n\n%s' "${{ steps.pr.outputs.pr_url }}")
            else
              MESSAGE=$(printf '🔧 Auto-fix (Android) gotowy do przejrzenia\n\n%s' "${{ steps.pr.outputs.pr_url }}")
            fi
          else
            if [ "$CI_LANG" = "en" ]; then
              MESSAGE=$(printf '🤷 Claude could not find/fix the Android error from run #%s automatically — needs manual review.' "${{ github.event.inputs.run_id }}")
            else
              MESSAGE=$(printf '🤷 Claude nie znalazł/nie naprawił błędu Android z runu #%s automatycznie — potrzebna ręczna analiza.' "${{ github.event.inputs.run_id }}")
            fi
          fi
          TG_RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${MESSAGE}")
          if ! echo "$TG_RESPONSE" | grep -q '"ok":true'; then
            echo "::error::Telegram sendMessage nie powiodło się: $TG_RESPONSE"
            exit 1
          fi
